<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f4eddc" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./src/styles.css" />
  <title>Agenda iPad · Ink Test 0.1.7</title>
</head>
<body>
  <main id="app" class="app-shell">
    <header class="testbar" aria-label="Controlli test scrittura">
      <div class="brand">
        <strong>Agenda iPad</strong>
        <span>INK TEST 0.1.7</span>
      </div>
      <div class="mode-group" role="group" aria-label="Pipeline input">
        <button class="mode-btn active" data-mode="coalesced" type="button">Coalesced</button>
        <button class="mode-btn" data-mode="direct" type="button">Direct</button>
        <button class="mode-btn" data-mode="raw" type="button">Raw</button>
      </div>
      <div class="resolution-group" role="group" aria-label="Risoluzione canvas">
        <button class="res-btn active" data-res="1" type="button">1×</button>
        <button class="res-btn" data-res="retina" type="button">Retina</button>
      </div>
      <label class="width-control">Tratto
        <input id="widthSlider" type="range" min="1" max="7" step="0.5" value="2.5" />
      </label>
      <button id="clearBtn" class="clear-btn" type="button">Pulisci</button>
    </header>

    <section id="paper" class="paper" aria-label="Area test Apple Pencil">
      <canvas id="inkCanvas"></canvas>
      <div id="startHint" class="start-hint">Scrivi qui con Apple Pencil</div>
    </section>

    <footer class="diagnostics" aria-live="polite">
      <span id="supportInfo">Rilevamento API…</span>
      <span id="strokeInfo">Nessun tratto acquisito</span>
    </footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
