<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f4eddc" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./src/styles.css" />
  <title>Agenda iPad · Ink Storage Test 0.1.9</title>
</head>
<body>
  <main id="app" class="app-shell">
    <header class="testbar" aria-label="Controlli test scrittura">
      <div class="brand">
        <strong>Agenda iPad</strong>
        <span>INK STORAGE TEST 0.1.9</span>
      </div>

      <div class="mode-group" role="group" aria-label="Modalità test">
        <button class="mode-btn active" data-mode="ink" type="button">INK ONLY</button>
        <button class="mode-btn" data-mode="storage" type="button">INK + STORAGE</button>
      </div>

      <label class="width-control">Tratto
        <input id="widthSlider" type="range" min="1" max="7" step="0.5" value="2.5" />
      </label>

      <button id="clearBtn" class="clear-btn" type="button">Pulisci schermo</button>
      <button id="resetStorageBtn" class="reset-btn" type="button">Azzera storage</button>
    </header>

    <section id="paper" class="paper" aria-label="Area test Apple Pencil">
      <canvas id="inkCanvas"></canvas>
      <div id="startHint" class="start-hint">Coalesced + Retina · scrivi qui con Apple Pencil</div>
    </section>

    <footer class="diagnostics" aria-live="polite">
      <span id="supportInfo">Rilevamento API…</span>
      <span id="strokeInfo">Nessun tratto acquisito</span>
      <span id="storageInfo">Storage: inizializzazione…</span>
    </footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
