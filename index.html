<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#e9dfc8" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./src/styles.css" />
  <title>Agenda iPad · 0.1.12</title>
</head>
<body>
  <main class="stage" aria-label="Agenda iPad - reintegrazione controllata · Note del giorno">
    <section id="paper" class="paper" aria-label="Pagina Agenda giornaliera">
      <header id="pageHeader" class="page-header" aria-hidden="true">
        <div class="date-block">
          <div id="dayNumber" class="day-number">26</div>
          <div class="day-text">
            <div id="dayName" class="day-name">MERCOLEDÌ</div>
            <div id="monthName" class="month-name">agosto</div>
            <div class="page-kind-label"></div>
          </div>
        </div>
        <div class="page-meta">
          <div id="yearLabel" class="year-label">2026</div>
          <div class="note-counter"></div>
        </div>
      </header>

      <div class="hours" aria-hidden="true">
        <span>08:00</span><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span>
        <span>13:00</span><span>14:00</span><span>15:00</span><span>16:00</span><span>17:00</span>
        <span>18:00</span><span>19:00</span><span>20:00</span>
      </div>

      <canvas id="inkCanvas" aria-label="Area di scrittura Apple Pencil"></canvas>

      <footer class="baseline-footer">
        <span class="baseline-label">AGENDA · INK + PAGE TURN + NOTE</span>
        <span id="statusLabel" class="status-label">avvio</span>
        <button id="markLagButton" class="footer-button" type="button">LAG</button>
        <button id="versionButton" class="version-button" type="button" title="Diagnostica">v0.1.12</button>
      </footer>
    </section>
  </main>

  <section id="reportPanel" class="report-panel" hidden aria-label="Diagnostica Apple Pencil">
    <div class="report-card">
      <h2>Diagnostica Pencil 0.1.12</h2>
      <textarea id="reportText" readonly spellcheck="false"></textarea>
      <div class="report-actions">
        <button id="clearPageButton" type="button" class="danger">PULISCI PAGINA TEST</button>
        <button id="copyReportButton" type="button">COPIA REPORT</button>
        <button id="closeReportButton" type="button">CHIUDI</button>
      </div>
    </div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
